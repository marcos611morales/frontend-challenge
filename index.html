<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movimientos · agosto 2026</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      /*
       * Resuelve el tema ANTES del primer pintado. Si esto viviera en React, la página
       * se pintaría clara y saltaría a oscura al hidratar — el parpadeo blanco que hace
       * ver amateur a cualquier app con modo oscuro.
       *
       * Va en línea y sin `type="module"` a propósito: un módulo es diferido y correría
       * demasiado tarde, que es justo lo que se quiere evitar.
       */
      (function () {
        var tema = 'claro';
        try {
          var guardado = localStorage.getItem('zenfi:tema');
          tema =
            guardado === 'claro' || guardado === 'oscuro'
              ? guardado
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'oscuro'
                : 'claro';
        } catch (e) {
          /* Sin storage (modo privado): se cae al tema claro y la app sigue. */
        }
        document.documentElement.dataset.tema = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
